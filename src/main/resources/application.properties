spring.application.name=book-catalog

# --- База данных ---
spring.datasource.url=jdbc:postgresql://localhost:5432/book_catalog
spring.datasource.username=postgres
spring.datasource.password=777top
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none

# --- Liquibase ---
spring.liquibase.enabled=true

# --- Сервер ---
server.port=8080

# --- Spring Session ---
spring.session.jdbc.initialize-schema=always

# --- Логирование ---
# Наш пакет логируем на уровне DEBUG (видим всё)
logging.level.com.example.bookcatalog=DEBUG
# Spring Web логируем на INFO (только важные события)
logging.level.org.springframework.web=INFO
# SQL-запросы Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Формат записи в лог: время | уровень | имя класса | сообщение
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{36} - %msg%n
# Пишем лог и в файл (удобно показать преподавателю)
logging.file.name=logs/book-catalog.log

# --- Actuator ---
# Открываем все эндпоинты actuator (health, metrics, loggers и т.д.)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always